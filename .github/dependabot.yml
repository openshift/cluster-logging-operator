# Dependabot configuration for automated dependency updates
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go modules - main dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    # Group updates to reduce PR noise
    groups:
      # Kubernetes/OpenShift updates - minor versions only (more conservative)
      k8s-ecosystem:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "github.com/openshift/*"
        update-types:
          - "patch"
      # All other dependencies - minor and patch updates
      all-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "github.com/openshift/*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 2
    reviewers:
      - "jcantrill"
      - "vparfonov"
      - "Clee2691"
    assignees:
      - "jcantrill"
    labels:
      - "kind/dependency-change"
    commit-message:
      prefix: "chore"
    # Rebase strategy: auto-rebase PRs when base branch is updated
    rebase-strategy: "auto"
    # Allow both direct and indirect dependency updates
    # Indirect deps (transitive dependencies) will only create PRs for:
    # - Security vulnerabilities (always, regardless of this config)
    # - Version updates that are explicitly allowed below
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
