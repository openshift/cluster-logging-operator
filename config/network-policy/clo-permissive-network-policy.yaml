# NetworkPolicy for cluster-logging-operator manager pod
# This policy defines both ingress and egress rules required for the operator to function
# in a restrictive network environment. It only takes effect for traffic that a matching
# AdminNetworkPolicy rule allows or delegates with a Pass action; an AdminNetworkPolicy Deny
# takes precedence and cannot be overridden by this NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: cluster-logging-operator
  name: clo-permissive-network-policy
  namespace: openshift-logging
spec:
  podSelector:
    matchLabels:
      name: cluster-logging-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow metrics scraping (metrics-bind-address :8443)
    - ports:
      - port: 8443
        protocol: TCP
  egress:
    # Allow DNS resolution
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
    # Allow communication with Kubernetes API server
    - ports:
      - port: 6443
        protocol: TCP
