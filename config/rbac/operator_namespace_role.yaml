---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-logging-operator-serviceaccount-manager
  namespace: openshift-logging
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  - serviceaccounts/finalizers
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  - serviceaccounts/finalizers
  resourceNames:
  - logfilesmetricexporter
  verbs:
  - update
