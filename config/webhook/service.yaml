apiVersion: v1
kind: Service
metadata:
  name: cluster-logging-operator-webhook-service
  namespace: system
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: webhook-server-cert
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    name: cluster-logging-operator
