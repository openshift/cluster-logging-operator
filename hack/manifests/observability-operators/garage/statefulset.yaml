apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
spec:
  serviceName: garage
  replicas: 1
  template:
    spec:
      containers:
      - name: garage
        image: dxflrs/garage:v2.3.0
        command:
        - /garage
        - server
        - --single-node
        - --default-bucket
        env:
        - name: GARAGE_CONFIG_FILE
          value: /etc/garage/garage.toml
        - name: GARAGE_DEFAULT_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: access_key_id
              name: test
        - name: GARAGE_DEFAULT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: access_key_secret
              name: test
        - name: GARAGE_DEFAULT_BUCKET
          valueFrom:
            secretKeyRef:
              key: bucketnames
              name: test
        ports:
        - name: s3-api
          containerPort: 3900
        - name: rpc
          containerPort: 3901
        - name: s3-web
          containerPort: 3902
        - name: admin
          containerPort: 3903
        volumeMounts:
        - name: data
          mountPath: /var/lib/garage
        - name: config
          mountPath: /etc/garage
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: garage-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
