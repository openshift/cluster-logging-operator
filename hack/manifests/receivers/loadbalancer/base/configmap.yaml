apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-template-config
data:
  # Notice the ${VARIABLE} syntax. We use braces to cleanly separate them from Nginx text.
  nginx.conf.template: |
    worker_processes auto;
    pid /tmp/nginx.pid; # OpenShift non-root requirement

    events {
        worker_connections ${WORKER_CONNECTIONS};
    }

    stream {
        # Force DNS re-resolution to avoid stale IPs when backend pods restart
        # DNS_RESOLVER is extracted from /etc/resolv.conf at container startup
        resolver ${DNS_RESOLVER} valid=5s ipv6=off;

        # Use map to create a variable - required for dynamic DNS resolution
        map $remote_addr $backend_address {
            default ${TARGET_SERVICE}:${TARGET_PORT};
        }

        server {
            listen 8888;
            # Using a variable in proxy_pass forces per-connection DNS lookup
            proxy_pass $backend_address;
            proxy_timeout ${PROXY_TIMEOUT};

            # Limit connection reuse to ensure fresh connections
            proxy_socket_keepalive on;
        }
    }