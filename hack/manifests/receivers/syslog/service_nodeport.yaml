apiVersion: v1
kind: Service
metadata:
  name: rsyslog-service
  labels:
    app: rsyslog-server
spec:
  type: NodePort
  ports:
    - name: udp
      port: 514
      protocol: UDP
      targetPort: 55514
      nodePort: 32514
    - name: tcp
      port: 514
      protocol: TCP
      targetPort: 55514
      nodePort: 32514
  selector:
    app: rsyslog-server