apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: clo-protected-sa-workloads
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["replicationcontrollers"]
  variables:
    - name: podSpec
      expression: >-
        request.kind.kind == 'CronJob'
          ? object.spec.jobTemplate.spec.template.spec
          : object.spec.template.spec
    - name: sa
      expression: "has(variables.podSpec.serviceAccountName) ? variables.podSpec.serviceAccountName : 'default'"
    - name: saKey
      expression: "'sa_' + request.namespace + '_' + variables.sa"
    - name: isProtected
      expression: "has(params.data) && (variables.saKey in params.data)"
    - name: allowedCreators
      expression: "(has(params.data) && ('workloadCreators' in params.data)) ? params.data['workloadCreators'].split(',') : []"
    - name: otelcOwnerKey
      expression: >-
        has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(o, o.kind == 'OpenTelemetryCollector')
          ? 'otelc_' + request.namespace + '_' + object.metadata.ownerReferences.filter(o, o.kind == 'OpenTelemetryCollector')[0].name
          : ''
    - name: isAuthorizedOtelc
      expression: "has(params.data) && variables.otelcOwnerKey != '' && (variables.otelcOwnerKey in params.data)"
    - name: otelcCreators
      expression: "(has(params.data) && ('otelcCreators' in params.data)) ? params.data['otelcCreators'].split(',') : []"
  validations:
    # A protected ServiceAccount may be used by the operator itself, the
    # built-in workload controllers, or by the OpenTelemetry operator when the
    # workload it creates is owned by an OpenTelemetryCollector custom resource
    # deployed by an authorized ClusterLogForwarder (the otelc collector
    # implementation). Requester identity alone is not sufficient for the
    # latter: the owner check ties the exemption to collector custom resources
    # the ClusterLogForwarder controller created.
    - expression: "!variables.isProtected || (request.userInfo.username in variables.allowedCreators) || ((request.userInfo.username in variables.otelcCreators) && variables.isAuthorizedOtelc)"
      messageExpression: "'Workload uses protected ServiceAccount \"' + request.namespace + '/' + variables.sa + '\" which is only allowed for use by authorized ClusterLogForwarders'"
      reason: Forbidden
