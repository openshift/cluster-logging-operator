api:
  address: 127.0.0.1:8686
  enabled: true
data_dir: /var/lib/vector/openshift-logging/my-forwarder
expire_metrics_secs: 60
log_schema:
  host_key: hostname
secret:
  kubernetes_secret:
    path: /var/run/ocp-collector/secrets
    type: directory
sinks:
  output_kafka_receiver:
    bootstrap_servers: broker1-kafka.svc.messaging.cluster.local:9092
    encoding:
      codec: json
      except_fields:
      - _internal
      timestamp_format: rfc3339
    healthcheck:
      enabled: false
    inputs:
    - output_kafka_receiver_topic
    tls:
      ca_file: /var/run/ocp-collector/secrets/kafka-receiver-1/ca-bundle.crt
      ciphersuites: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,ECDHE-ECDSA-AES128-GCM-SHA256,ECDHE-RSA-AES128-GCM-SHA256,ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-ECDSA-CHACHA20-POLY1305,ECDHE-RSA-CHACHA20-POLY1305
      crt_file: /var/run/ocp-collector/secrets/kafka-receiver-1/tls.crt
      curves: X25519MLKEM768:X25519:prime256v1:secp384r1
      enabled: true
      key_file: /var/run/ocp-collector/secrets/kafka-receiver-1/tls.key
      min_tls_version: VersionTLS12
    topic: '{{ _internal.output_kafka_receiver_topic }}'
    type: kafka
  prometheus_output:
    address: '[::]:24231'
    auth:
      path: /metrics
      strategy: sar
      verb: get
    default_namespace: collector
    inputs:
    - add_nodename_to_metric
    tls:
      ciphersuites: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,ECDHE-ECDSA-AES128-GCM-SHA256,ECDHE-RSA-AES128-GCM-SHA256,ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-ECDSA-CHACHA20-POLY1305,ECDHE-RSA-CHACHA20-POLY1305
      crt_file: /etc/collector/metrics/tls.crt
      curves: X25519MLKEM768:X25519:prime256v1:secp384r1
      enabled: true
      key_file: /etc/collector/metrics/tls.key
      min_tls_version: VersionTLS12
    type: prometheus_exporter
sources:
  input_myinfra_container:
    auto_partial_merge: true
    exclude_paths_glob_patterns:
    - /var/log/pods/*/*/*.gz
    - /var/log/pods/*/*/*.log.*
    - /var/log/pods/*/*/*.tmp
    - /var/log/pods/openshift-logging_*/gateway/*.log
    - /var/log/pods/openshift-logging_*/loki*/*.log
    - /var/log/pods/openshift-logging_*/opa/*.log
    - /var/log/pods/openshift-logging_elasticsearch-*/*/*.log
    - /var/log/pods/openshift-logging_kibana-*/*/*.log
    - /var/log/pods/openshift-logging_logfilesmetricexporter-*/*/*.log
    glob_minimum_cooldown_ms: 15000
    include_paths_glob_patterns:
    - /var/log/pods/default_*/*/*.log
    - /var/log/pods/kube*_*/*/*.log
    - /var/log/pods/openshift*_*/*/*.log
    max_read_bytes: 3145728
    namespace_annotation_fields:
      namespace_uid: kubernetes.namespace_id
    node_annotation_fields:
      node_labels: ""
    pod_annotation_fields:
      pod_annotations: kubernetes.annotations
      pod_labels: kubernetes.labels
      pod_namespace: kubernetes.namespace_name
      pod_node_name: hostname
      pod_uid: kubernetes.pod_id
    rotate_wait_secs: 5
    type: kubernetes_logs
    use_apiserver_cache: true
  input_mytestapp_container:
    auto_partial_merge: true
    exclude_paths_glob_patterns:
    - /var/log/pods/*/*/*.gz
    - /var/log/pods/*/*/*.log.*
    - /var/log/pods/*/*/*.tmp
    - /var/log/pods/default_*/*/*.log
    - /var/log/pods/kube*_*/*/*.log
    - /var/log/pods/openshift*_*/*/*.log
    glob_minimum_cooldown_ms: 15000
    include_paths_glob_patterns:
    - /var/log/pods/test-ns_*/*/*.log
    max_read_bytes: 3145728
    namespace_annotation_fields:
      namespace_uid: kubernetes.namespace_id
    node_annotation_fields:
      node_labels: ""
    pod_annotation_fields:
      pod_annotations: kubernetes.annotations
      pod_labels: kubernetes.labels
      pod_namespace: kubernetes.namespace_name
      pod_node_name: hostname
      pod_uid: kubernetes.pod_id
    rotate_wait_secs: 5
    type: kubernetes_logs
    use_apiserver_cache: true
  internal_metrics:
    type: internal_metrics
transforms:
  add_nodename_to_metric:
    inputs:
    - internal_metrics
    source: .tags.hostname = get_env_var!("VECTOR_SELF_NODE_NAME")
    type: remap
  input_myinfra_container_meta:
    inputs:
    - input_myinfra_container
    source: |-
      . = {"_internal": .}
      if exists(._internal.stream) {._internal.kubernetes.container_iostream = ._internal.stream}
      if exists(._internal.file) && !exists(._internal.kubernetes.namespace_name) {
        parsed_path, err = parse_regex(string!(._internal.file), r'^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>.+)_(?P<uid>[a-f0-9-]{36})/(?P<container>[^/]+)/\d+\.log$')
        if err == null {
          ._internal.kubernetes.namespace_name = parsed_path.namespace
          ._internal.kubernetes.pod_name = parsed_path.pod
          ._internal.kubernetes.pod_id = parsed_path.uid
          ._internal.kubernetes.container_name = parsed_path.container
        }
      }
      ._internal.log_source = "container"
      # If namespace is infra, label log_type as infra
      if match_any(string(._internal.kubernetes.namespace_name) ?? "", [r'^default$', r'^openshift(-.+)?$', r'^kube(-.+)?$']) {
        ._internal.log_type = "infrastructure"
      } else {
        ._internal.log_type = "application"
      }
      ._internal.hostname = get_env_var("VECTOR_SELF_NODE_NAME") ?? ""
      ._internal.openshift = { "cluster_id": "${OPENSHIFT_CLUSTER_ID:-}"}
      ._internal.openshift.sequence = to_unix_timestamp(now(), unit: "nanoseconds")
      if !exists(._internal.level) {
        level = null
        message = ._internal.message
        # attempt 1: parse as logfmt (e.g. level=error msg="Failed to connect")
        parsed_logfmt, err = parse_logfmt(message)
        if err == null && is_string(parsed_logfmt.level) {
          level = downcase!(parsed_logfmt.level)
        }
        # attempt 2: parse as klog (e.g. I0920 14:22:00.089385 1 scheduler.go:592] "Successfully bound pod to node")
        if level == null {
          parsed_klog, err = parse_klog(message)
          if err == null && is_string(parsed_klog.level) {
            level = parsed_klog.level
          }
        }
        # attempt 3: parse with groks template (if previous attempts failed) for classic text logs like Logback, Log4j etc.
        if level == null {
          parsed_grok, err = parse_groks(message,
          patterns: [
            "%{common_prefix} %{_message}"
          ],
          aliases: {
            "common_prefix": "%{_timestamp} %{_loglevel}",
            "_timestamp": "%{TIMESTAMP_ISO8601:timestamp}",
            "_loglevel": "%{LOGLEVEL:level}",
            "_message": "%{GREEDYDATA:message}"
          }
        )
        if err == null && is_string(parsed_grok.level) {
          level = downcase!(parsed_grok.level)
        }
      }
      if level == null {
        level = "default"
        # attempt 4: Match on well known structured patterns
        # Order: emergency, alert, critical, error, warn, notice, info, debug, trace
        if match!(message, r'^EM[0-9]+|(?i:level=emergency|Value:emergency|"level":"emergency")') {
          level = "emergency"
        } else if match!(message, r'^A[0-9]+|(?i:level=alert|Value:alert|"level":"alert")') {
          level = "alert"
        } else if match!(message, r'^C[0-9]+|(?i:level=critical|Value:critical|"level":"critical")') {
          level = "critical"
        } else if match!(message, r'^E[0-9]+|(?i:level=error|Value:error|"level":"error")') {
          level = "error"
        } else if match!(message, r'^W[0-9]+|(?i:level=warn|Value:warn|"level":"warn")') {
          level = "warn"
        } else if match!(message, r'^N[0-9]+|(?i:level=notice|Value:notice|"level":"notice")') {
          level = "notice"
        } else if match!(message, r'^I[0-9]+|(?i:level=info|Value:info|"level":"info")') {
          level = "info"
        } else if match!(message, r'^D[0-9]+|(?i:level=debug|Value:debug|"level":"debug")') {
          level = "debug"
        } else if match!(message, r'^T[0-9]+|(?i:level=trace|Value:trace|"level":"trace")') {
          level = "trace"
        }
        # attempt 5: Match on the keyword that appears earliest in the message
        if level == "default" {
          level_patterns = r'(?i)(?<emergency>emergency|<emergency>)|(?<alert>alert|<alert>)|(?<critical>critical|<critical>)|(?<error>error|<error>)|(?<warn>warn(?:ing)?|<warn>)|(?<notice>notice|<notice>)|(?:\b(?<info>info)\b|<info>)|(?<debug>debug|<debug>)|(?<trace>trace|<trace>)'
          parsed, err = parse_regex(message, level_patterns)
          if err == null {
            if is_string(parsed.emergency) {
              level = "emergency"
            } else if is_string(parsed.alert) {
              level = "alert"
            } else if is_string(parsed.critical) {
              level = "critical"
            } else if is_string(parsed.error) {
              level = "error"
            } else if is_string(parsed.warn) {
              level = "warn"
            } else if is_string(parsed.notice) {
              level = "notice"
            } else if is_string(parsed.info) {
              level = "info"
            } else if is_string(parsed.debug) {
              level = "debug"
            } else if is_string(parsed.trace) {
              level = "trace"
            }
          }
        }
      }
      ._internal.level = level
      }
    type: remap
  input_mytestapp_container_meta:
    inputs:
    - input_mytestapp_container
    source: |-
      . = {"_internal": .}
      if exists(._internal.stream) {._internal.kubernetes.container_iostream = ._internal.stream}
      if exists(._internal.file) && !exists(._internal.kubernetes.namespace_name) {
        parsed_path, err = parse_regex(string!(._internal.file), r'^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>.+)_(?P<uid>[a-f0-9-]{36})/(?P<container>[^/]+)/\d+\.log$')
        if err == null {
          ._internal.kubernetes.namespace_name = parsed_path.namespace
          ._internal.kubernetes.pod_name = parsed_path.pod
          ._internal.kubernetes.pod_id = parsed_path.uid
          ._internal.kubernetes.container_name = parsed_path.container
        }
      }
      ._internal.log_source = "container"
      # If namespace is infra, label log_type as infra
      if match_any(string(._internal.kubernetes.namespace_name) ?? "", [r'^default$', r'^openshift(-.+)?$', r'^kube(-.+)?$']) {
        ._internal.log_type = "infrastructure"
      } else {
        ._internal.log_type = "application"
      }
      ._internal.hostname = get_env_var("VECTOR_SELF_NODE_NAME") ?? ""
      ._internal.openshift = { "cluster_id": "${OPENSHIFT_CLUSTER_ID:-}"}
      ._internal.openshift.sequence = to_unix_timestamp(now(), unit: "nanoseconds")
      if !exists(._internal.level) {
        level = null
        message = ._internal.message
        # attempt 1: parse as logfmt (e.g. level=error msg="Failed to connect")
        parsed_logfmt, err = parse_logfmt(message)
        if err == null && is_string(parsed_logfmt.level) {
          level = downcase!(parsed_logfmt.level)
        }
        # attempt 2: parse as klog (e.g. I0920 14:22:00.089385 1 scheduler.go:592] "Successfully bound pod to node")
        if level == null {
          parsed_klog, err = parse_klog(message)
          if err == null && is_string(parsed_klog.level) {
            level = parsed_klog.level
          }
        }
        # attempt 3: parse with groks template (if previous attempts failed) for classic text logs like Logback, Log4j etc.
        if level == null {
          parsed_grok, err = parse_groks(message,
          patterns: [
            "%{common_prefix} %{_message}"
          ],
          aliases: {
            "common_prefix": "%{_timestamp} %{_loglevel}",
            "_timestamp": "%{TIMESTAMP_ISO8601:timestamp}",
            "_loglevel": "%{LOGLEVEL:level}",
            "_message": "%{GREEDYDATA:message}"
          }
        )
        if err == null && is_string(parsed_grok.level) {
          level = downcase!(parsed_grok.level)
        }
      }
      if level == null {
        level = "default"
        # attempt 4: Match on well known structured patterns
        # Order: emergency, alert, critical, error, warn, notice, info, debug, trace
        if match!(message, r'^EM[0-9]+|(?i:level=emergency|Value:emergency|"level":"emergency")') {
          level = "emergency"
        } else if match!(message, r'^A[0-9]+|(?i:level=alert|Value:alert|"level":"alert")') {
          level = "alert"
        } else if match!(message, r'^C[0-9]+|(?i:level=critical|Value:critical|"level":"critical")') {
          level = "critical"
        } else if match!(message, r'^E[0-9]+|(?i:level=error|Value:error|"level":"error")') {
          level = "error"
        } else if match!(message, r'^W[0-9]+|(?i:level=warn|Value:warn|"level":"warn")') {
          level = "warn"
        } else if match!(message, r'^N[0-9]+|(?i:level=notice|Value:notice|"level":"notice")') {
          level = "notice"
        } else if match!(message, r'^I[0-9]+|(?i:level=info|Value:info|"level":"info")') {
          level = "info"
        } else if match!(message, r'^D[0-9]+|(?i:level=debug|Value:debug|"level":"debug")') {
          level = "debug"
        } else if match!(message, r'^T[0-9]+|(?i:level=trace|Value:trace|"level":"trace")') {
          level = "trace"
        }
        # attempt 5: Match on the keyword that appears earliest in the message
        if level == "default" {
          level_patterns = r'(?i)(?<emergency>emergency|<emergency>)|(?<alert>alert|<alert>)|(?<critical>critical|<critical>)|(?<error>error|<error>)|(?<warn>warn(?:ing)?|<warn>)|(?<notice>notice|<notice>)|(?:\b(?<info>info)\b|<info>)|(?<debug>debug|<debug>)|(?<trace>trace|<trace>)'
          parsed, err = parse_regex(message, level_patterns)
