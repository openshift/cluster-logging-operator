[sources.input_my_app_container]
type = "kubernetes_logs"
max_read_bytes = 3145728
glob_minimum_cooldown_ms = 15000
auto_partial_merge = true
include_paths_glob_patterns = ["/var/log/pods/kube-apiserver_*/*/*.log", "/var/log/pods/openshift-logging_*/*/*.log", "/var/log/pods/test-ns-foo_*/*/*.log"]
exclude_paths_glob_patterns = ["/var/log/pods/*/*/*.gz", "/var/log/pods/*/*/*.log.*", "/var/log/pods/*/*/*.tmp", "/var/log/pods/default_*/*/*.log", "/var/log/pods/openshift*_*/*/*.log", "/var/log/pods/test-ns1_*/*/*.log"]
rotate_wait_secs = 5
use_apiserver_cache = true

[sources.input_my_app_container.pod_annotation_fields]
pod_labels = "kubernetes.labels"
pod_namespace = "kubernetes.namespace_name"
pod_annotations = "kubernetes.annotations"
pod_uid = "kubernetes.pod_id"
pod_node_name = "hostname"

[sources.input_my_app_container.namespace_annotation_fields]
namespace_uid = "kubernetes.namespace_id"

[transforms.input_my_app_container_meta]
type = "remap"
inputs = ["input_my_app_container"]
source = '''
  . = {"_internal": .}
  if exists(._internal.stream) {._internal.kubernetes.container_iostream = ._internal.stream}

if exists(._internal.file) && !exists(._internal.kubernetes.namespace_name) {
  parsed_path, err = parse_regex(string!(._internal.file), r'^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>.+)_(?P<uid>[a-f0-9-]{36})/(?P<container>[^/]+)/\d+\.log$')
  if err == null {
    ._internal.kubernetes.namespace_name = parsed_path.namespace
    ._internal.kubernetes.pod_name = parsed_path.pod
    ._internal.kubernetes.pod_id = parsed_path.uid
    ._internal.kubernetes.container_name = parsed_path.container
  }
}
  ._internal.log_source = "container"
  # If namespace is infra, label log_type as infra
  if match_any(string(._internal.kubernetes.namespace_name) ?? "", [r'^default$', r'^openshift(-.+)?$', r'^kube(-.+)?$']) {
      ._internal.log_type = "infrastructure"
  } else {
      ._internal.log_type = "application"
  }

  ._internal.hostname = get_env_var("VECTOR_SELF_NODE_NAME") ?? ""
  ._internal.openshift = { "cluster_id": "${OPENSHIFT_CLUSTER_ID:-}"}
  ._internal.openshift.sequence = to_unix_timestamp(now(), unit: "nanoseconds")

  if !exists(._internal.level) {
  level = null
  message = ._internal.message

  # attempt 1: logfmt-style level token (e.g. level=error, severity=WARN, lvl="info").
  # A single linear-time regex replaces parse_logfmt, whose nom-based parser rescans
  # the remaining input per token when no '=' follows (quadratic on multi-MB lines,
  # see LOG-8640) and builds a map of every key to extract one field.
  parsed_level, err = parse_regex(message, r'(?i)(?:^|\s)(?:level|severity|lvl)="?(?P<level>emerg(?:ency)?|alert|crit(?:ical)?|err(?:or)?|fatal|severe|warn(?:ing)?|notice|info(?:rmational)?|debug|trace)"?')
  if err == null {
    level = downcase!(parsed_level.level)
  }

  # attempt 2: klog header (e.g. I0920 14:22:00.089385 1 scheduler.go:592] "Successfully bound pod to node").
  # A linear-time regex replaces parse_klog, which also parsed/validated the timestamp
  # and built a full map only for the severity letter to be discarded.
  if level == null {
    parsed_klog, err = parse_regex(message, r'^\s*(?P<level>[IWEF])\d{4} \d{2}:\d{2}:\d{2}\.\d{6}\s+\d+ .+:\d+\]\s')
    if err == null {
      level = if parsed_klog.level == "I" { "info" } else if parsed_klog.level == "W" { "warning" } else if parsed_klog.level == "E" { "error" } else { "fatal" }
    }
  }

  # attempt 3: parse with groks template (if previous attempts failed) for classic text logs like Logback, Log4j etc.

  if level == null {
    parsed_grok, err = parse_groks(
      message,
      patterns: [
        "%{common_prefix} %{_message}"
      ],
      aliases: {
        "common_prefix": "%{_timestamp} %{_loglevel}",
        "_timestamp": "%{TIMESTAMP_ISO8601:timestamp}",
        "_loglevel": "%{LOGLEVEL:level}",
        "_message": "%{GREEDYDATA:message}"
      }
    )

    if err == null && is_string(parsed_grok.level) {
      level = downcase!(parsed_grok.level)
    }
  }

  if level == null {
    level = "default"

    # attempt 4: Match on well known structured patterns (klog severity prefixes,
    # Value:<sev>, JSON "level":"<sev>" - the level=<sev> token moved to attempt 1)
    # Order: emergency, alert, critical, error, warn, notice, info, debug, trace

    if match!(message, r'^EM[0-9]+|(?i:Value:emergency|"level":"emergency")') {
      level = "emergency"
    } else if match!(message, r'^A[0-9]+|(?i:Value:alert|"level":"alert")') {
      level = "alert"
    } else if match!(message, r'^C[0-9]+|(?i:Value:critical|"level":"critical")') {
      level = "critical"
    } else if match!(message, r'^E[0-9]+|(?i:Value:error|"level":"error")') {
      level = "error"
    } else if match!(message, r'^W[0-9]+|(?i:Value:warn|"level":"warn")') {
      level = "warn"
    } else if match!(message, r'^N[0-9]+|(?i:Value:notice|"level":"notice")') {
      level = "notice"
    } else if match!(message, r'^I[0-9]+|(?i:Value:info|"level":"info")') {
      level = "info"
    } else if match!(message, r'^D[0-9]+|(?i:Value:debug|"level":"debug")') {
      level = "debug"
    } else if match!(message, r'^T[0-9]+|(?i:Value:trace|"level":"trace")') {
      level = "trace"
    }

    # attempt 5: Match on the keyword that appears earliest in the message


    if level == "default" {
      level_patterns = r'(?i)(?<emergency>emergency|<emergency>)|(?<alert>alert|<alert>)|(?<critical>critical|<critical>)|(?<error>error|<error>)|(?<warn>warn(?:ing)?|<warn>)|(?<notice>notice|<notice>)|(?:\b(?<info>info)\b|<info>)|(?<debug>debug|<debug>)|(?<trace>trace|<trace>)'
      parsed, err = parse_regex(message, level_patterns)
      if err == null {
        if is_string(parsed.emergency) {
          level = "emergency"
        } else if is_string(parsed.alert) {
          level = "alert"
        } else if is_string(parsed.critical) {
          level = "critical"
        } else if is_string(parsed.error) {
          level = "error"
        } else if is_string(parsed.warn) {
          level = "warn"
        } else if is_string(parsed.notice) {
          level = "notice"
        } else if is_string(parsed.info) {
          level = "info"
        } else if is_string(parsed.debug) {
          level = "debug"
        } else if is_string(parsed.trace) {
          level = "trace"
        }
      }
    }
  }
  ._internal.level = level
}

'''
