sinks:
  s3:
    auth:
      credentials_file: /var/run/ocp-collector/config/my-forwarder-aws-creds/credentials
      profile: output_s3
    bucket: my-test-bucket
    encoding:
      codec: json
      except_fields:
      - _internal
    healthcheck:
      enabled: false
    inputs:
    - s3_key_prefix
    key_prefix: '{{ _internal.s3_key_prefix }}'
    region: us-east-test
    type: aws_s3
transforms:
  s3_key_prefix:
    inputs:
    - s3-forward
    source: ._internal.s3_key_prefix = "app-" + to_string!(._internal.log_type||"missing")
    type: remap
