sinks:
  es_1:
    api_version: v8
    bulk:
      action: create
      index: '{{ _internal.es_1_index }}'
    encoding:
      except_fields:
      - _internal
    endpoints:
    - https://es.svc.infra.cluster:9200
    inputs:
    - es_1_index
    type: elasticsearch
transforms:
  es_1_index:
    inputs:
    - application
    source: ._internal.es_1_index = "foo-" + to_string!(._internal.kubernetes.namespace||"none")
    type: remap
