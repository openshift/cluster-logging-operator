sinks:
  output_default_loki_apps:
    auth:
      strategy: bearer
      token: SECRET[kubernetes_secret.logcollector-token/token]
    encoding:
      codec: json
      except_fields:
      - _internal
    endpoint: https://lokistack-dev-gateway-http.openshift-logging.svc:8080/api/logs/v1/application
    healthcheck:
      enabled: false
    inputs:
    - output_default_loki_apps_remap_label
    labels:
      k8s_container_name: '{{kubernetes.container_name}}'
      k8s_namespace_name: '{{kubernetes.namespace_name}}'
      k8s_node_name: ${VECTOR_SELF_NODE_NAME}
      k8s_pod_name: '{{kubernetes.pod_name}}'
      kubernetes_container_name: '{{kubernetes.container_name}}'
      kubernetes_host: ${VECTOR_SELF_NODE_NAME}
      kubernetes_namespace_name: '{{kubernetes.namespace_name}}'
      kubernetes_pod_name: '{{kubernetes.pod_name}}'
      log_type: '{{log_type}}'
      openshift_log_type: '{{log_type}}'
    out_of_order_action: accept
    tls:
      ca_file: /var/run/ocp-collector/secrets/logcollector-token/service-ca.crt
      ciphersuites: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,ECDHE-ECDSA-AES128-GCM-SHA256,ECDHE-RSA-AES128-GCM-SHA256,ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-ECDSA-CHACHA20-POLY1305,ECDHE-RSA-CHACHA20-POLY1305
      curves: X25519MLKEM768:X25519:prime256v1:secp384r1
      min_tls_version: VersionTLS12
    type: loki
transforms:
  output_default_loki_apps_remap:
    inputs:
    - output_default_loki_apps_throttle
    source: del(.tag)
    type: remap
  output_default_loki_apps_remap_label:
    inputs:
    - output_default_loki_apps_remap
    source: |-
      if !exists(.kubernetes.namespace_name) {
        .kubernetes.namespace_name = ""
      }
      if !exists(.kubernetes.pod_name) {
        .kubernetes.pod_name = ""
      }
      if !exists(.kubernetes.container_name) {
        .kubernetes.container_name = ""
      }
    type: remap
  output_default_loki_apps_throttle:
    inputs:
    - application
    threshold: 100
    type: throttle
    window_secs: 1
