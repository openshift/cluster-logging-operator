sinks:
  gcl_1:
    billing_account_id: billing-1
    credentials_path: /var/run/ocp-collector/secrets/gcl-1/google-application-credentials.json
    encoding:
      except_fields:
      - _internal
    inputs:
    - gcl_1_normalize_severity
    log_id: '{{ _internal.gcl_1_log_id }}'
    resource:
      node_name: '{{hostname}}'
      type: k8s_node
    severity_key: level
    tls:
      ca_file: /var/run/ocp-collector/secrets/gcl-1/ca-bundle.crt
      crt_file: /var/run/ocp-collector/secrets/gcl-1/tls.crt
      key_file: /var/run/ocp-collector/secrets/gcl-1/tls.key
    type: gcp_stackdriver_logs
transforms:
  gcl_1_log_id:
    inputs:
    - application
    source: ._internal.gcl_1_log_id = "vector-1"
    type: remap
  gcl_1_normalize_severity:
    inputs:
    - gcl_1_log_id
    source: |-
      # Set audit log level to 'INFO'
      if .log_type == "audit" {
        .level = "INFO"
      } else if !exists(.level) {
        .level = "DEFAULT"
      } else if .level == "warn" {
        .level = "WARNING"
      } else if .level == "trace" {
        .level = "DEBUG"
      } else {
        .level = upcase!(.level)
      }
    type: remap
