sinks:
  http_receiver:
    auth:
      strategy: bearer
      token: SECRET[kubernetes_secret.http-receiver/token]
    encoding:
      codec: json
      except_fields:
      - _internal
    inputs:
    - application
    method: post
    request:
      headers:
        h1: v1
        h2: v2
    type: http
    uri: https://my-logstore.com
