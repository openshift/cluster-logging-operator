sinks:
  kafka_receiver:
    bootstrap_servers: broker1-kafka.svc.messaging.cluster.local:9092
    encoding:
      codec: json
      except_fields:
      - _internal
      timestamp_format: rfc3339
    healthcheck:
      enabled: false
    inputs:
    - kafka_receiver_topic
    topic: '{{ _internal.kafka_receiver_topic }}'
    type: kafka
transforms:
  kafka_receiver_topic:
    inputs:
    - pipeline_1
    - pipeline_2
    source: ._internal.kafka_receiver_topic = "foo-bar" + to_string!(._internal.log_type||"none")
    type: remap
