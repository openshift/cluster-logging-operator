sinks:
  kafka_receiver:
    bootstrap_servers: broker1-kafka.svc.messaging.cluster.local:9092
    encoding:
      codec: json
      except_fields:
      - _internal
      timestamp_format: rfc3339
    healthcheck:
      enabled: false
    inputs:
    - kafka_receiver_topic
    sasl:
      enabled: true
      mechanism: SCRAM-SHA-256
      password: SECRET[kubernetes_secret.kafka-receiver-1/password]
      username: SECRET[kubernetes_secret.kafka-receiver-1/username]
    tls:
      ca_file: /var/run/ocp-collector/secrets/kafka-receiver-1/ca-bundle.crt
      crt_file: /var/run/ocp-collector/secrets/kafka-receiver-1/tls.crt
      enabled: true
      key_file: /var/run/ocp-collector/secrets/kafka-receiver-1/tls.key
    topic: '{{ _internal.kafka_receiver_topic }}'
    type: kafka
transforms:
  kafka_receiver_topic:
    inputs:
    - pipeline_1
    - pipeline_2
    source: ._internal.kafka_receiver_topic = "topic"
    type: remap
