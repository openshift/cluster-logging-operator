sinks:
  kafka_receiver:
    batch:
      max_bytes: 10000000
    bootstrap_servers: broker1-kafka.svc.messaging.cluster.local:9092
    buffer:
      max_size: 268435488
      type: disk
      when_full: block
    encoding:
      codec: json
      except_fields:
      - _internal
      timestamp_format: rfc3339
    healthcheck:
      enabled: false
    inputs:
    - kafka_receiver_topic
    librdkafka_options:
      message.max.bytes: "10000000"
    topic: '{{ _internal.kafka_receiver_topic }}'
    type: kafka
transforms:
  kafka_receiver_topic:
    inputs:
    - pipeline_1
    - pipeline_2
    source: ._internal.kafka_receiver_topic = "topic"
    type: remap
