sinks:
  output_default_lokistack_application:
    batch:
      max_bytes: 10000000
    buffer:
      max_size: 268435488
      type: disk
      when_full: block
    inputs:
    - output_default_lokistack_application_resource_logs
    protocol:
      auth:
        strategy: bearer
        token: SECRET[kubernetes_secret.test-sa-token/token]
      compression: gzip
      encoding:
        codec: json
        except_fields:
        - _internal
      method: post
      payload_prefix: '{"resourceLogs":'
      payload_suffix: '}'
      request:
        retry_initial_backoff_secs: 20
        retry_max_duration_secs: 35
      tls:
        ca_file: /var/run/ocp-collector/config/openshift-service-ca.crt/ca-bundle.crt
      type: http
      uri: https://logging-loki-gateway-http.openshift-logging.svc:8080/api/logs/v1/application/otlp/v1/logs
    type: opentelemetry
  output_default_lokistack_audit:
