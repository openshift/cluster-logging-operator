sinks:
  output_default_lokistack_audit:
    auth:
      strategy: bearer
      token: SECRET[kubernetes_secret.test-sa-token/token]
    encoding:
      codec: json
      except_fields:
      - _internal
    endpoint: https://logging-loki-gateway-http.openshift-logging.svc:8080/api/logs/v1/audit
    healthcheck:
      enabled: false
    inputs:
    - output_default_lokistack_audit_remap_label
    labels:
      k8s_container_name: '{{kubernetes.container_name}}'
      k8s_namespace_name: '{{kubernetes.namespace_name}}'
      k8s_node_name: ${VECTOR_SELF_NODE_NAME}
      k8s_pod_name: '{{kubernetes.pod_name}}'
      kubernetes_container_name: '{{kubernetes.container_name}}'
      kubernetes_host: ${VECTOR_SELF_NODE_NAME}
      kubernetes_namespace_name: '{{kubernetes.namespace_name}}'
      kubernetes_pod_name: '{{kubernetes.pod_name}}'
      log_type: '{{log_type}}'
      openshift_log_type: '{{log_type}}'
    out_of_order_action: accept
    tls:
      ca_file: /var/run/ocp-collector/config/openshift-service-ca.crt/ca-bundle.crt
    type: loki
  output_default_lokistack_infrastructure:
    auth:
      strategy: bearer
      token: SECRET[kubernetes_secret.test-sa-token/token]
    encoding:
      codec: json
      except_fields:
      - _internal
    endpoint: https://logging-loki-gateway-http.openshift-logging.svc:8080/api/logs/v1/infrastructure
    healthcheck:
      enabled: false
    inputs:
    - output_default_lokistack_infrastructure_remap_label
    labels:
      k8s_container_name: '{{kubernetes.container_name}}'
      k8s_namespace_name: '{{kubernetes.namespace_name}}'
      k8s_node_name: ${VECTOR_SELF_NODE_NAME}
      k8s_pod_name: '{{kubernetes.pod_name}}'
      kubernetes_container_name: '{{kubernetes.container_name}}'
      kubernetes_host: ${VECTOR_SELF_NODE_NAME}
      kubernetes_namespace_name: '{{kubernetes.namespace_name}}'
      kubernetes_pod_name: '{{kubernetes.pod_name}}'
      log_type: '{{log_type}}'
      openshift_log_type: '{{log_type}}'
    out_of_order_action: accept
    tls:
      ca_file: /var/run/ocp-collector/config/openshift-service-ca.crt/ca-bundle.crt
    type: loki
transforms:
  output_default_lokistack_audit_remap:
    inputs:
    - output_default_lokistack_route.audit
    source: del(.tag)
    type: remap
  output_default_lokistack_audit_remap_label:
    inputs:
    - output_default_lokistack_audit_remap
    source: |-
      if !exists(.kubernetes.namespace_name) {
        .kubernetes.namespace_name = ""
      }
      if !exists(.kubernetes.pod_name) {
        .kubernetes.pod_name = ""
      }
      if !exists(.kubernetes.container_name) {
        .kubernetes.container_name = ""
      }
    type: remap
  output_default_lokistack_infrastructure_remap:
    inputs:
    - output_default_lokistack_route.infrastructure
    source: del(.tag)
    type: remap
  output_default_lokistack_infrastructure_remap_label:
    inputs:
    - output_default_lokistack_infrastructure_remap
    source: |-
      if !exists(.kubernetes.namespace_name) {
        .kubernetes.namespace_name = ""
      }
      if !exists(.kubernetes.pod_name) {
        .kubernetes.pod_name = ""
      }
      if !exists(.kubernetes.container_name) {
        .kubernetes.container_name = ""
      }
    type: remap
  output_default_lokistack_route:
    inputs:
    - pipeline_fake
    route:
      audit: .log_type == "audit"
      infrastructure: .log_type == "infrastructure"
    type: route
  output_default_lokistack_route_unmatched:
    inputs:
    - output_default_lokistack_route._unmatched
    metrics:
    - field: message
      kind: incremental
      name: component_event_unmatched_count
      namespace: logcollector
      tags:
        component_id: output_default_lokistack_route
        log_source: '{{ log_source }}'
        log_type: '{{ log_type }}'
        output_type: lokistack
      type: counter
    type: log_to_metric
